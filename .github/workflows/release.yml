# Publish dns-shield to PyPI on a version tag, using Trusted Publishing (OIDC).
#
# No API token or password is used or stored anywhere. GitHub mints a short-lived
# OIDC token and PyPI verifies it against the pending/publisher you configure.
#
# ONE-TIME SETUP (owner, do this once before the first tag):
#   PyPI -> Your projects -> Publishing -> "Add a pending publisher"
#     PyPI Project Name : dns-shield
#     Owner             : beduldul
#     Repository name   : dns-shield
#     Workflow name     : release.yml
#     Environment name  : pypi
#   Then create a GitHub Environment named "pypi" (repo Settings -> Environments).
#
# RELEASE FLOW: bump the version in pyproject.toml and dns_shield/__init__.py,
# add a CHANGELOG entry, commit, then `git tag v<version> && git push origin v<version>`.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` / `user:` -- authentication is via OIDC only.
