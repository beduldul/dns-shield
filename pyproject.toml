[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dns-shield"
version = "0.1.0"
description = "Detect ISP DNS poisoning and transparently work around it with DNS-over-HTTPS and SNI-preserving connections."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "beduldul", email = "alkaysan07@gmail.com" }]
keywords = [
    "dns",
    "dns-over-https",
    "doh",
    "dns-poisoning",
    "sni",
    "censorship",
    "network-diagnostics",
    "cloudfront",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

# Runtime dependencies: deliberately ZERO.
#
# The library resolves over DoH with urllib.request and speaks HTTP/1.1 over a
# socket it opens itself, both from the standard library. There is no hard
# dependency because anything added here would have to be installed by every
# user on a machine whose network may already be hostile.
dependencies = []

[project.optional-dependencies]
# The optional requests transport adapter. Nothing else needs it.
requests = ["requests>=2.28"]
# httpx support is not implemented; listed here only to keep the intent clear.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/beduldul/dns-shield"
Source = "https://github.com/beduldul/dns-shield"
Issues = "https://github.com/beduldul/dns-shield/issues"
Changelog = "https://github.com/beduldul/dns-shield/blob/main/CHANGELOG.md"

[project.scripts]
dns-shield = "dns_shield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dns_shield"]

[tool.hatch.build.targets.sdist]
include = [
    "/dns_shield",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
# `-m "not live"` is applied by default so a bare `pytest` run never touches
# the network. `pytest -m live` overrides it to run the integration tests.
addopts = "-m 'not live' --strict-markers --strict-config"
markers = [
    "live: hits the real network; deselected by default, run with -m live",
]
filterwarnings = ["error::DeprecationWarning:dns_shield.*"]

[tool.coverage.run]
branch = true
source = ["dns_shield"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["dns_shield"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",  # Any is legitimate at the urllib/requests interop boundary
]

[tool.ruff.lint.pydocstyle]
convention = "google"
